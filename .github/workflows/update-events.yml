# Recolhe os eventos uma vez por dia e publica a app + events.json no GitHub Pages.
# A app Android lê o events.json publicado, por isso recebe eventos novos sem ser reinstalada.
name: Atualizar eventos

on:
  schedule:
    # 04:30 UTC: depois da recolha do Umbrel (04:00 em Lisboa, ver umbrel/README.md), cujos dados
    # chegam ao ramo "data". Um push para "data" não dispara workflows (o ramo não os contém).
    - cron: '30 4 * * *'
  # Alterações ao código também são publicadas; a recolha só corre se a última tiver mais de 20 h.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar recolha mesmo que a última tenha sido há menos de 20 h'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Nunca há duas recolhas em simultâneo.
concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # O código vem sempre de main, mesmo quando quem disparou foi o ramo "data".
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      # Cache HTTP do scraper (páginas de detalhe, robots.txt, ETags) entre execuções.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: scraper-cache-${{ github.run_id }}
          restore-keys: scraper-cache-

      # Dados mais recentes: os do Umbrel (ramo "data") ou, na falta deles, os já publicados.
      # Servem de reserva se uma fonte falhar e para o travão de "no máximo uma recolha a cada 20 h".
      - name: Obter dados mais recentes
        run: |
          if git fetch --depth 1 origin data 2>/dev/null; then
            git show origin/data:events.json > public/data/events.json && echo "Dados do Umbrel"
          else
            curl -fsSL "${{ steps.pages.outputs.base_url }}/data/events.json" -o public/data/events.json || echo "Sem dados anteriores"
          fi

      - name: Recolher eventos
        run: node scraper/index.mjs ${{ inputs.force && '--force' || '' }}

      - name: Compilar app web
        run: npm run build
        env:
          VITE_DATA_URL: ${{ steps.pages.outputs.base_url }}/data/events.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
